name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[gui]"
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_web.js tests/test_workflow_v2_web.js
      - run: smartcorrection run examples/tmex_demo/pipeline.json --db db/demo.sqlite --output exports/demo
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-fonts-recommended texlive-lang-french lmodern
      - run: python -m pip install ".[gui]"
      - run: python -m unittest discover -s tests -v
        env:
          SMARTCORRECTION_TEST_PDF: "1"
      - run: python -m moteur run examples/tmex_demo/pipeline.json --db db/demo.sqlite --output exports/demo --pdf
